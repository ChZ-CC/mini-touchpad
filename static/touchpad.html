<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机触控板</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
        }

        #touch-area {
            flex: 1;
            width: 100%;
            background: #ffffff00;
            z-index: 1000;
        }

        #control-buttons {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #222;
            align-items: center;
        }

        .speed-control {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            color: #555;
        }

        .speed-label {
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
        }

        #mouse-speed-input {
            flex: 1;
            min-width: 80px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #333;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            background: #555;
        }

        .control-btn.active {
            background: #4CAF50;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <div id="control-buttons">
        <div class="speed-control">
            <span class="speed-label">灵敏度</span>
            <input type="range" id="mouse-speed-input" min="1" max="10" value="3" step="0.1">
        </div>
        <button class="control-btn" id="toggle-gypro">陀螺仪</button>
        <button class="control-btn" id="right-click">右键</button>
    </div>
    <div id="touch-area"></div>

    <script>
        // 指令常量
        const CMD = {
            MOVE: 'move|',
            LEFT_DOWN: 'left_down|',
            LEFT_UP: 'left_up|',
            RIGHT_DOWN: 'right_down|',
            RIGHT_UP: 'right_up|',
            SCROLL: 'scroll|'
        };

        // 获取鼠标移动速度（从input输入获取，数值越小越灵敏）
        function getMouseSpeed() {
            return parseFloat(document.getElementById('mouse-speed-input').value);
        }

        // 点击阈值（像素）
        const CLICK_THRESHOLD = 10;
        const MESSAGE_INTERVAL = 16;
        const WEBSOCKET_PORT = 9877;
        const DEBUG_MODE = false;

        // 陀螺仪相关变量
        let isGyroEnabled = false;
        const gyroThreshold = 0.25; // 陀螺仪灵敏度阈值

        // 连接电脑的WebSocket服务（使用当前页面的IP地址）
        const ws = new WebSocket('wss://' + window.location.hostname + ':' + WEBSOCKET_PORT);

        let lastX = 0, lastY = 0;
        let startX = 0, startY = 0;
        let isDragging = false;
        let currentTouchCount = 0; // 当前触摸手指数量
        const touchArea = document.getElementById('touch-area');
        const gyroBtn = document.getElementById('toggle-gypro');

        // WebSocket连接状态
        ws.onopen = () => {
            console.log('WebSocket连接成功');
            alert('连接成功！现在可以使用触控板了');
        };

        ws.onclose = () => {
            console.log('WebSocket连接关闭');
        };

        // 发送指令
        function sendCommand(command) {
            let formatedCommand = command;
            if (DEBUG_MODE) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
                const timeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}.${milliseconds}`;
                formatedCommand = command + "|" + timeStr;
            }
            ws.send(formatedCommand);
        }

        // 监听触摸开始事件
        touchArea.addEventListener('touchstart', (e) => {
            console.log('触摸开始，触点数:', e.touches.length);
            e.preventDefault(); // 阻止默认滑动（如页面缩放）

            currentTouchCount = e.touches.length;

            if (e.touches.length >= 1) {
                // 单指触摸
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                lastX = touch.clientX;
                lastY = touch.clientY;
                isDragging = false;
            }
        });

        // 消息合并和节流
        let moveTimer = null;

        // 监听触摸滑动事件
        touchArea.addEventListener('touchmove', (e) => {
            e.preventDefault();

            // 检查是否超过点击阈值
            const touch = e.touches[0];
            const distance = Math.sqrt(
                Math.pow(touch.clientX - startX, 2) +
                Math.pow(touch.clientY - startY, 2)
            );

            if (distance > CLICK_THRESHOLD) {
                isDragging = true;
            } else {
                return;
            }

            // 计算偏移量（乘以系数调整灵敏度）
            let dx = touch.clientX - lastX;
            let dy = touch.clientY - lastY;

            // 清除之前的定时器
            if (moveTimer) {
                clearTimeout(moveTimer);
            }
            // 设置新的定时器，16ms发送一次合并后的消息（约60fps）
            moveTimer = setTimeout(() => {
                if (currentTouchCount === 1) {
                    // 鼠标移动
                    dx = dx * getMouseSpeed();
                    dy = dy * getMouseSpeed();
                    const moveCommand = CMD.MOVE + `${dx},${dy}`;
                    // 发送数据
                    sendCommand(moveCommand);
                } else if (currentTouchCount === 2) {
                    // 双指滚轮
                    const scrollCommand = CMD.SCROLL + `${dx},${dy}`;
                    sendCommand(scrollCommand);
                }
            }, MESSAGE_INTERVAL);

            // 更新上次坐标
            lastX = touch.clientX;
            lastY = touch.clientY;
        });

        // 监听触摸结束事件
        touchArea.addEventListener('touchend', (e) => {
            e.preventDefault();

            if (e.touches.length === 0 && !isDragging) {
                if (currentTouchCount === 1) {
                    // 单指离开屏幕 - 检查是否是单指点击
                    const distance = Math.sqrt(
                        Math.pow(lastX - startX, 2) +
                        Math.pow(lastY - startY, 2)
                    );

                    if (distance <= CLICK_THRESHOLD) {
                        // 是单指点击操作
                        console.log('执行单指点击（左键）');
                        // 模拟点击：按下后立即抬起
                        sendCommand(CMD.LEFT_DOWN);
                        // 短暂延迟后发送抬起指令
                        setTimeout(() => {
                            sendCommand(CMD.LEFT_UP);
                        }, 50);
                    }
                } else if (currentTouchCount === 2) {
                    // 双指离开屏幕 - 检查是否是双指点击
                    const distance = Math.sqrt(
                        Math.pow(lastX - startX, 2) +
                        Math.pow(lastY - startY, 2)
                    );

                    if (distance <= CLICK_THRESHOLD) {
                        // 是双指点击操作
                        console.log('执行双指点击（右键）');
                        // 模拟点击：按下后立即抬起
                        sendCommand(CMD.RIGHT_DOWN);
                        // 短暂延迟后发送抬起指令
                        setTimeout(() => {
                            sendCommand(CMD.RIGHT_UP);
                        }, 50);
                    }
                }
                currentTouchCount = 0;
            }
        });

        // 监听WebSocket连接错误
        ws.onerror = (error) => {
            console.error('WebSocket错误:', error);
            alert('连接失败！请检查：\n1. 电脑和手机同WiFi\n2. 电脑IP填写正确\n3. 服务已启动');
        };

        // 陀螺仪处理函数
        function handleGyroscope(event) {
            if (!isGyroEnabled) return;

            const rot = event.rotationRate;
            if (!rot) return;

            const alpha = rot.alpha; // Z轴旋转（0-360度）
            const beta = rot.beta;   // X轴倾斜（-180到180度）
            const gamma = rot.gamma; // Y轴倾斜（-90到90度）

            // 计算变化量
            let dx = -gamma * getMouseSpeed() * 0.5;
            let dy = -alpha * getMouseSpeed() * 0.5;
            dx = Math.abs(dx) < gyroThreshold ? 0 : dx - Math.sign(dx) * gyroThreshold;
            dy = Math.abs(dy) < gyroThreshold ? 0 : dy - Math.sign(dy) * gyroThreshold;

            // 检查是否超过阈值
            if (dx !== 0 || dy !== 0) {
                const moveCommand = CMD.MOVE + `${dx},${dy}`;
                sendCommand(moveCommand);
            }
        }

        // 陀螺仪切换
        gyroBtn.addEventListener('click', () => {
            isGyroEnabled = !isGyroEnabled;

            if (isGyroEnabled) {
                // 检查浏览器是否支持
                if (typeof DeviceMotionEvent === 'undefined') {
                    alert('您的浏览器不支持陀螺仪功能，请使用手机浏览器');
                    isGyroEnabled = false;
                    gyroBtn.classList.remove('active');
                    gyroBtn.textContent = '陀螺仪';
                    return;
                }

                // 开启陀螺仪
                gyroBtn.classList.add('active');
                gyroBtn.textContent = '陀螺仪 ON';

                // 请求权限（某些浏览器需要）
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission()
                        .then(permission => {
                            if (permission === 'granted') {
                                window.addEventListener('devicemotion', handleGyroscope);
                            } else {
                                alert('请允许陀螺仪权限');
                                isGyroEnabled = false;
                                gyroBtn.classList.remove('active');
                                gyroBtn.textContent = '陀螺仪';
                            }
                        })
                        .catch(err => {
                            console.error('陀螺仪权限请求失败:', err);
                            alert('陀螺仪权限请求失败' + err);
                            isGyroEnabled = false;
                            gyroBtn.classList.remove('active');
                            gyroBtn.textContent = '陀螺仪';
                        });
                } else {
                    // 不需要权限的浏览器
                    window.addEventListener('devicemotion', handleGyroscope);
                }

            } else {
                // 关闭陀螺仪
                gyroBtn.classList.remove('active');
                gyroBtn.textContent = '陀螺仪';
                window.removeEventListener('devicemotion', handleGyroscope);
            }
        });

        // 右键点击按钮
        document.getElementById('right-click').addEventListener('click', () => {
            console.log('执行右键点击');
            sendCommand(CMD.RIGHT_DOWN);
            setTimeout(() => {
                sendCommand(CMD.RIGHT_UP);
            }, 50);
        });
    </script>
</body>

</html>
