<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机触控板</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 防止出现滚动条 */
            -webkit-overflow-scrolling: touch;
            /* iOS平滑滚动 */
        }

        body {
            height: 100vh;
            min-height: -webkit-fill-available;
            /* 适配iOS Safari */
            min-height: -moz-available;
            /* 适配Firefox */
            min-height: fill-available;
            /* 标准语法 */
        }

        .touch-area {
            flex: 1;
            width: 100%;
            background: #ffffff00;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        #footer {
            background: #222;
            padding: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #control-buttons {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #222;
            align-items: center;
        }

        .speed-control {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            color: #555;
        }

        .speed-label {
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
        }

        #mouse-speed-input {
            flex: 1;
            min-width: 60px;
        }

        .control-btn {
            padding: 6px;
            border-radius: 4px;
            background: #333;
            color: white;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            background: #555;
        }

        .control-btn.active {
            background: #4CAF50;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }

        #connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 14px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected .status-indicator {
            background-color: #4CAF50;
            /* 绿色 */
        }

        .status-connected .status-text {
            color: #4CAF50;
            /* 绿色 */
        }

        .status-disconnected .status-indicator {
            background-color: #999;
            /* 灰色 */
        }

        .status-disconnected .status-text {
            color: #999;
            /* 灰色 */
        }
    </style>
</head>

<body>
    <div id="control-buttons">
        <div class="speed-control">
            <span class="speed-label">灵敏度</span>
            <input type="range" id="mouse-speed-input" min="1" max="10" value="3" step="0.1">
        </div>
        <button class="control-btn" id="toggle-gypro">陀螺仪</button>
    </div>
    <div id="touch-area" class="touch-area">
        <div class="touch-area"></div>
        <div id="footer">
            <div id="connection-status">
                <span class="status-indicator"></span>
                <span class="status-text">未连接</span>
            </div>
        </div>
    </div>


    <script>
        // 指令常量
        const CMD = {
            MOVE: 'move|',
            LEFT_CLICK: 'left_click|',
            RIGHT_CLICK: 'right_click|',
            SCROLL: 'scroll|'
        };

        // 获取鼠标移动速度（从input输入获取，数值越小越灵敏）
        function getMouseSpeed() {
            return parseFloat(document.getElementById('mouse-speed-input').value);
        }

        // 点击阈值（像素）
        const CLICK_THRESHOLD = 10;
        const MESSAGE_INTERVAL = 16;
        const WEBSOCKET_PORT = 9877;
        const DEBUG_MODE = false;

        // 陀螺仪相关变量
        let isGyroEnabled = false;
        const gyroThreshold = 0.5; // 陀螺仪灵敏度阈值

        // WebSocket连接参数
        let ws;
        let reconnectInterval = 1000; // 初始重连间隔1秒
        let maxReconnectInterval = 30000; // 最大重连间隔30秒
        let reconnectDecay = 1.5; // 重连间隔递增倍数
        let reconnectTimeoutId = null;
        let heartbeatIntervalId = null;
        let isManualClose = false; // 标记是否为手动关闭
        let isReconnecting = false; // 标记是否正在重连中，防止重复触发

        // 日志配置
        const LOG_LEVELS = {
            DEBUG: 0,
            INFO: 1,
            WARN: 2,
            ERROR: 3,
            OFF: 4
        };

        // 当前日志级别（可根据需要修改）
        let currentLogLevel = LOG_LEVELS.WARN;

        // 日志辅助函数
        function log(message, level = 'INFO') {
            // 根据日志级别过滤输出
            if (LOG_LEVELS[level] === undefined || LOG_LEVELS[level] < currentLogLevel) {
                return; // 低于当前日志级别的日志不输出
            }

            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.${String(now.getMilliseconds()).padStart(3, '0')}`;
            const colorMap = {
                INFO: '#4CAF50',
                WARN: '#FF9800',
                ERROR: '#f44336',
                DEBUG: '#2196F3'
            };
            console.log(`%c[${timeStr}] [WEBSOCKET] [${level}] ${message}`, `color: ${colorMap[level] || '#999'}`);
        }

        // 创建WebSocket连接
        function createWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                return ws;
            }
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const url = protocol + window.location.hostname + ':' + WEBSOCKET_PORT;
            log(`[createWebSocket] 创建连接, URL: ${url}`, 'DEBUG');
            return new WebSocket(url);
        }

        // 初始化WebSocket连接
        ws = createWebSocket();

        let lastX = 0, lastY = 0;
        let startX = 0, startY = 0;
        let isDragging = false;
        let currentTouchCount = 0; // 当前触摸手指数量
        const touchArea = document.getElementById('touch-area');
        const gyroBtn = document.getElementById('toggle-gypro');

        // 获取连接状态元素
        const connectionStatus = document.getElementById('connection-status');
        const statusText = connectionStatus.querySelector('.status-text');

        // 更新连接状态显示
        function updateConnectionStatus(connected) {
            if (connected) {
                connectionStatus.className = 'status-connected';
                statusText.textContent = '已连接';
            } else {
                connectionStatus.className = 'status-disconnected';
                statusText.textContent = '未连接';
            }
        }

        // 初始化连接状态为未连接
        updateConnectionStatus(false);

        // 发送心跳
        function sendHeartbeat() {
            if (ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send('ping'); // 发送心跳包
                } catch (e) {
                    log(`[sendHeartbeat] 心跳发送失败: ${e.message}`, 'ERROR');
                    // 心跳发送失败，触发重连
                    if (!isManualClose) {
                        log(`[sendHeartbeat] 触发自动重连`, 'WARN');
                        reconnect();
                    }
                }
            } else if (!isManualClose) {
                log(`[sendHeartbeat] 连接未打开(状态: ${ws.readyState})，触发重连`, 'WARN');
                // 连接未打开，触发重连
                reconnect();
            }
        }

        // 重连WebSocket
        window.reconnect = function () {
            if (isManualClose) {
                log(`[reconnect] 手动关闭状态，跳过重连`, 'DEBUG');
                return; // 如果是手动关闭，则不重连
            }
            if (isReconnecting) {
                log(`[reconnect] 正在重连中，跳过重复触发`, 'DEBUG');
                return; // 如果正在重连中，则不重复触发
            }

            isReconnecting = true; // 标记为正在重连
            updateConnectionStatus(false); // 显示为未连接状态
            log(`[reconnect] 开始重连, 当前重连间隔: ${reconnectInterval}ms`, 'INFO');

            // 清除之前的重连定时器
            if (reconnectTimeoutId) {
                log(`[reconnect] 清除之前的重连定时器`, 'DEBUG');
                clearTimeout(reconnectTimeoutId);
            }

            // 设置重连定时器
            reconnectTimeoutId = setTimeout(() => {
                log(`[reconnect] 执行重连操作`, 'DEBUG');
                ws = createWebSocket();
                setupWebSocketHandlers();

                // 指数退避算法增加重连间隔
                reconnectInterval = Math.min(reconnectInterval * reconnectDecay, maxReconnectInterval);
                log(`[reconnect] 重连间隔更新为: ${reconnectInterval}ms`, 'DEBUG');
                isReconnecting = false; // 重置重连状态
            }, reconnectInterval);
        }

        // 设置WebSocket事件处理器
        function setupWebSocketHandlers() {
            log(`[setupWebSocketHandlers] 设置WebSocket事件处理器`, 'DEBUG');

            ws.onopen = () => {
                log(`[onopen] WebSocket连接成功`, 'INFO');
                updateConnectionStatus(true); // 更新连接状态为已连接
                reconnectInterval = 1000; // 重置重连间隔
                isReconnecting = false; // 重置重连状态

                // 启动心跳定时器
                if (heartbeatIntervalId) {
                    log(`[onopen] 清除之前的心跳定时器`, 'DEBUG');
                    clearInterval(heartbeatIntervalId);
                }
                heartbeatIntervalId = setInterval(sendHeartbeat, 30000); // 每30秒发送一次心跳
                log(`[onopen] 心跳定时器已启动，间隔: 30000ms`, 'DEBUG');
            };

            ws.onclose = () => {
                log(`[onclose] WebSocket连接关闭`, 'WARN');
                updateConnectionStatus(false); // 更新连接状态为未连接
            };

            ws.onerror = (error) => {
                log(`[onerror] WebSocket错误: ${error.message || error}`, 'ERROR');
                updateConnectionStatus(false); // 更新连接状态为未连接
            };
        }

        // 初始化WebSocket事件处理器
        setupWebSocketHandlers();

        // 页面可见性API - 当页面从后台恢复时尝试重连
        document.addEventListener('visibilitychange', () => {
            log(`[visibilitychange] 页面可见性变化, hidden: ${document.hidden}, 连接状态: ${ws.readyState}`, 'DEBUG');

            if (!document.hidden && !isManualClose) {
                // 页面变为可见且WebSocket未连接时，尝试重连
                log(`[visibilitychange] 页面恢复可见`, 'DEBUG');
                setTimeout(() => {
                    if (ws.readyState !== WebSocket.OPEN) {
                        log(`[visibilitychange] 页面恢复可见，连接未打开，执行重连`, 'INFO');
                        reconnect();
                    }
                }, 1000);
            }
        });

        // 页面卸载前清理资源
        window.addEventListener('beforeunload', () => {
            log(`[beforeunload] 页面即将卸载，清理资源`, 'INFO');
            isManualClose = true; // 标记为手动关闭，防止自动重连

            // 清理定时器
            if (reconnectTimeoutId) {
                log(`[beforeunload] 清除重连定时器`, 'DEBUG');
                clearTimeout(reconnectTimeoutId);
            }
            if (heartbeatIntervalId) {
                log(`[beforeunload] 清除心跳定时器`, 'DEBUG');
                clearInterval(heartbeatIntervalId);
            }

            // 关闭WebSocket连接
            if (ws && ws.readyState === WebSocket.OPEN) {
                log(`[beforeunload] 关闭WebSocket连接`, 'DEBUG');
                ws.close();
            }
        });

        // 发送指令
        function sendCommand(command) {
            // 检查连接状态
            if (ws.readyState !== WebSocket.OPEN) {
                log(`[sendCommand] WebSocket未连接(状态: ${ws.readyState})，无法发送指令: ${command}`, 'WARN');
                return;
            }

            let formatedCommand = command;
            if (DEBUG_MODE) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
                const timeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}.${milliseconds}`;
                formatedCommand = command + "|" + timeStr;
            }

            try {
                ws.send(formatedCommand);
                log(`[sendCommand] 指令发送成功: ${command}`, 'DEBUG');
            } catch (e) {
                log(`[sendCommand] 指令发送失败: ${command}, 错误: ${e.message}`, 'ERROR');
                // 发送失败时触发重连
                if (!isManualClose) {
                    log(`[sendCommand] 发送失败，触发重连`, 'WARN');
                    reconnect();
                }
            }
        }

        // 监听触摸开始事件
        touchArea.addEventListener('touchstart', (e) => {
            log(`触摸开始，触点数: ${e.touches.length}`, 'DEBUG');
            e.preventDefault(); // 阻止默认滑动（如页面缩放）

            currentTouchCount = e.touches.length;

            if (e.touches.length >= 1) {
                // 单指触摸
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                lastX = touch.clientX;
                lastY = touch.clientY;
                isDragging = false;
            }
        });

        // 消息合并和节流
        let moveTimer = null;

        // 监听触摸滑动事件
        touchArea.addEventListener('touchmove', (e) => {
            e.preventDefault();

            // 检查是否超过点击阈值
            const touch = e.touches[0];
            const distance = Math.sqrt(
                Math.pow(touch.clientX - startX, 2) +
                Math.pow(touch.clientY - startY, 2)
            );

            if (distance > CLICK_THRESHOLD) {
                isDragging = true;
            } else {
                return;
            }

            // 计算偏移量（乘以系数调整灵敏度）
            let dx = touch.clientX - lastX;
            let dy = touch.clientY - lastY;

            // 清除之前的定时器
            if (moveTimer) {
                clearTimeout(moveTimer);
            }
            // 设置新的定时器，16ms发送一次合并后的消息（约60fps）
            moveTimer = setTimeout(() => {
                if (currentTouchCount === 1) {
                    // 鼠标移动
                    dx = dx * getMouseSpeed();
                    dy = dy * getMouseSpeed();
                    const moveCommand = CMD.MOVE + `${dx},${dy}`;
                    // 发送数据
                    sendCommand(moveCommand);
                } else if (currentTouchCount === 2) {
                    // 双指滚轮
                    const scrollCommand = CMD.SCROLL + `${-dx},${dy}`;
                    sendCommand(scrollCommand);
                }
            }, MESSAGE_INTERVAL);

            // 更新上次坐标
            lastX = touch.clientX;
            lastY = touch.clientY;
        });

        // 监听触摸结束事件
        touchArea.addEventListener('touchend', (e) => {
            e.preventDefault();

            if (e.touches.length === 0 && !isDragging) {
                if (currentTouchCount === 1) {
                    // 单指离开屏幕 - 检查是否是单指点击
                    const distance = Math.sqrt(
                        Math.pow(lastX - startX, 2) +
                        Math.pow(lastY - startY, 2)
                    );

                    if (distance <= CLICK_THRESHOLD) {
                        // 是单指点击操作
                        log('执行单指点击（左键）', 'DEBUG');
                        // 模拟点击：按下后立即抬起
                        sendCommand(CMD.LEFT_CLICK);
                    }
                } else if (currentTouchCount === 2) {
                    // 双指离开屏幕 - 检查是否是双指点击
                    const distance = Math.sqrt(
                        Math.pow(lastX - startX, 2) +
                        Math.pow(lastY - startY, 2)
                    );

                    if (distance <= CLICK_THRESHOLD) {
                        // 是双指点击操作
                        log('执行双指点击（右键）', 'DEBUG');
                        // 模拟点击：按下后立即抬起
                        sendCommand(CMD.RIGHT_CLICK);
                    }
                }
                currentTouchCount = 0;
            }
        });



        // 陀螺仪处理函数
        function handleGyroscope(event) {
            if (!isGyroEnabled) return;

            const rot = event.rotationRate;
            if (!rot) return;

            const alpha = rot.alpha; // Z轴旋转（0-360度）
            const beta = rot.beta;   // X轴倾斜（-180到180度）
            const gamma = rot.gamma; // Y轴倾斜（-90到90度）

            // 计算变化量
            let dx = -gamma * getMouseSpeed() * 0.5;
            let dy = -alpha * getMouseSpeed() * 0.5;
            dx = Math.abs(dx) < gyroThreshold ? 0 : dx - Math.sign(dx) * gyroThreshold;
            dy = Math.abs(dy) < gyroThreshold ? 0 : dy - Math.sign(dy) * gyroThreshold;

            // 检查是否超过阈值
            if (dx !== 0 || dy !== 0) {
                const moveCommand = CMD.MOVE + `${dx},${dy}`;
                sendCommand(moveCommand);
            }
        }

        // 陀螺仪切换
        gyroBtn.addEventListener('click', () => {
            isGyroEnabled = !isGyroEnabled;

            if (isGyroEnabled) {
                // 检查浏览器是否支持
                if (typeof DeviceMotionEvent === 'undefined') {
                    alert('您的浏览器不支持陀螺仪功能，请使用手机浏览器');
                    isGyroEnabled = false;
                    gyroBtn.classList.remove('active');
                    return;
                }

                // 开启陀螺仪
                gyroBtn.classList.add('active');

                // 请求权限（某些浏览器需要）
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission()
                        .then(permission => {
                            if (permission === 'granted') {
                                window.addEventListener('devicemotion', handleGyroscope);
                            } else {
                                log('陀螺仪权限被拒绝', 'ERROR');
                                isGyroEnabled = false;
                                gyroBtn.classList.remove('active');
                            }
                        })
                        .catch(err => {
                            log('陀螺仪权限请求失败:' + err, 'ERROR');
                            isGyroEnabled = false;
                            gyroBtn.classList.remove('active');
                        });
                } else {
                    // 不需要权限的浏览器
                    window.addEventListener('devicemotion', handleGyroscope);
                }

            } else {
                // 关闭陀螺仪
                gyroBtn.classList.remove('active');
                window.removeEventListener('devicemotion', handleGyroscope);
            }
        });
    </script>
</body>

</html>
